# Lint settings used by CI (TASK-02). Run locally with: ruff check .
# The rule set is small on purpose: syntax errors and pyflakes checks (unused or
# undefined names) that usually point at real bugs. Style rules can be added
# once the team agrees on them.
target-version = "py312"
extend-exclude = ["**/migrations/**"]  # generated by makemigrations

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# pytest fixtures are imported and then requested by name as test arguments,
# which pyflakes reports as a redefinition.
"**/tests/**" = ["F811"]
# Unused imports that already existed when lint was added. The file's owner
# removes its line here the next time they edit that file. New files are
# checked in full.
"apps/accounts/admin.py" = ["F401"]
"apps/accounts/models.py" = ["F401"]
"apps/bookings/views.py" = ["F401"]
"apps/dashboard/admin.py" = ["F401"]
"apps/dashboard/models.py" = ["F401"]
"apps/dashboard/views.py" = ["F401"]
"apps/frontdesk/admin.py" = ["F401"]
"apps/frontdesk/models.py" = ["F401"]
"apps/frontdesk/views.py" = ["F401"]
"apps/properties/views.py" = ["F401"]
"apps/rooms/admin.py" = ["F401"]
"apps/rooms/tests/test_crud.py" = ["F401"]
"apps/rooms/tests/test_models.py" = ["F401"]
